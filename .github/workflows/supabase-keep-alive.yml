name: Supabase Keep Alive

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 */3 * *"

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase
        run: |
          curl --fail-with-body \
            "${{ secrets.SUPABASE_URL }}/rest/v1/articles?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"